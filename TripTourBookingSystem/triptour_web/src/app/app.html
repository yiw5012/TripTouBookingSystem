<mat-toolbar color="primary" class="top-navbar">
  <span>TripTour Admin Panel</span>
  <span class="spacer"></span>
  <small>ผู้ดูแลระบบ</small>
</mat-toolbar>

<mat-sidenav-container class="admin-container">
  
  <mat-sidenav mode="side" opened class="admin-sidebar">
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active-menu" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon >dashboard</mat-icon> หน้าภาพรวม (Dashboard)
      </a>
      <a mat-list-item routerLink="/add-tour" routerLinkActive="active-menu">
        <mat-icon >add_location</mat-icon> เพิ่มทัวร์ใหม่
      </a>
      <a mat-list-item routerLink="/add-guide" routerLinkActive="active-menu">
        <mat-icon >person_add</mat-icon> เพิ่มไกด์นำเที่ยว
      </a>
       <a mat-list-item routerLink="/members" routerLinkActive="active-menu">
        <mat-icon >people</mat-icon> จัดการสมาชิก
      </a>
       <a mat-list-item routerLink="/chat" routerLinkActive="active-menu">
        <mat-icon >chat</mat-icon> แชท
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content">
    <div class="container-fluid py-4">
      <router-outlet></router-outlet>
      
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
